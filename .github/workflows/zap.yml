name: Simple Owasp Zap Scan (Logs Only)
on:
  workflow dispatch:
  push:
    branches: 
    - master
    - main
permissions: 
  contents: read
jobs:
  zap:
  runs-on: ubuntu-latest
  steps:
  - name: Checkout repsitory
    uses: actions/checkout@v4
  - name: Run Owasp Zap Baseline Scan
    uses: zaproxy/action-baseline@v0.12.0
    with:
      target: 'https://example.com'
      cmd_options: '-a'
